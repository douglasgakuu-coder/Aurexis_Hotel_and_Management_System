<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Aurexis Hotel</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="auth">
      <!-- FORM SIDE -->
      <div class="auth-form-side">
        <div class="auth-brand">
          <img src="img/Logo%20img.jpg" alt="Aurexis logo" class="logo-img">
          <div class="brand-name">AUREXIS</div>
        </div>
        <h2>Welcome Back</h2>
        <p class="sub">Sign in to manage your reservations</p>
        <form>
          <div class="field">
            <label for="lemail">Email Address</label>
            <input
              type="email"
              id="lemail"
              placeholder="you@example.com"
              required
            />
            <p class="error">Please enter a valid email.</p>
          </div>
          <div class="field">
            <label for="lpass">Password</label>
            <div class="pw-wrap">
              <input
                type="password"
                id="lpass"
                placeholder="••••••••"
                required
              />
            </div>
            <p class="error">Please enter your password.</p>
          </div>
          <div class="auth-row">
            <label class="remember"
              ><input type="checkbox" /> Remember me</label
            >
            <a class="forgot" href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-full">Sign In</button>
        </form>
        <p class="auth-alt">
          New to AUREXIS? <a href="signup.html">Create an account</a>
        </p>
      </div>

      <!-- IMAGE SIDE -->
      <div class="auth-side">
        <div class="hero-media">
        </div>
        <div class="auth-side-caption">
          <h2>Luxury Awaits</h2>
          <p>
            Sign in to unlock member rates and manage your stays at AUREXIS
            Hotel.
          </p>
        </div>
      </div>
    </main>  </body>
</html>
