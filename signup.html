<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Aurexis Hotel</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <main class="auth">
      <!-- FORM SIDE -->
      <div class="auth-form-side">
        <div class="auth-brand">
          <img src="img/Logo%20img.jpg" alt="Aurexis logo" class="logo-img">
          <div class="brand-name">AUREXIS</div>
        </div>
        <h2>Create Account</h2>
        <p class="sub">Join AUREXIS for exclusive member rates</p>
        <form>
          <div class="field">
            <label for="sname">Full Name</label>
            <input
              type="text"
              id="sname"
              placeholder="Your full name"
              required
            />
            <p class="error">Please enter your name.</p>
          </div>
          <div class="field">
            <label for="semail">Email Address</label>
            <input
              type="email"
              id="semail"
              placeholder="you@example.com"
              required
            />
            <p class="error">Please enter a valid email.</p>
          </div>
          <div class="field">
            <label for="pw">Password</label>
            <div class="pw-wrap">
              <input
                type="password"
                id="pw"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
              />
            </div>
            <p class="error">Password must be at least 8 characters.</p>
          </div>
          <div class="field">
            <label for="cpw">Confirm Password</label>
            <div class="pw-wrap">
              <input
                type="password"
                id="cpw"
                placeholder="Re-enter password"
                minlength="8"
                required
              />
            </div>
            <p class="error">Passwords must match.</p>
          </div>
          <button type="submit" class="btn btn-full">Sign Up</button>
        </form>
        <p class="auth-alt">
          Already a member? <a href="login.html">Sign in</a>
        </p>
      </div>

      <!-- IMAGE SIDE -->
      <div class="auth-side">
        <div class="hero-media">
        </div>
        <div class="auth-side-caption">
          <h2>Join AUREXIS</h2>
          <p>
            Create an account for faster bookings, member rates and exclusive
            offers.
          </p>
        </div>
      </div>
    </main>  </body>
</html>
